<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }

    /* Subtle Animations */
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.4; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .particle-1 { animation: floatParticle 8s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 12s infinite ease-in-out reverse; }
    .pulse { animation: pulseGlow 4s infinite ease-in-out; }
    .flow-line {
      stroke-dasharray: 10 15;
      animation: dashFlow 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Network Lines (Strictly Behind Text) -->
  <g opacity="0.25">
    <path class="flow-line" d="M 50 80 Q 300 20 600 90 T 1150 50" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-line" d="M 100 300 Q 400 350 800 280 T 1100 320" fill="none" stroke="#ec4899" stroke-width="2" />
    <circle cx="850" cy="80" r="120" fill="url(#glowGrad)" class="pulse" filter="url(#glow)" />
    <circle cx="200" cy="280" r="90" fill="url(#glowGrad)" class="pulse" filter="url(#glow)" />
  </g>

  <!-- Decorative Abstract Geometric Shapes in Corners/Sides -->
  <g class="particle-1">
    <rect x="1020" y="60" width="40" height="40" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    <circle cx="1100" cy="140" r="6" fill="#a855f7" />
  </g>
  <g class="particle-2">
    <polygon points="90,60 110,95 70,95" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6" />
    <circle cx="120" cy="130" r="5" fill="#6366f1" />
  </g>

  <!-- Top Decorative Pill -->
  <g transform="translate(80, 75)">
    <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="17" r="6" fill="#10b981" />
    <text x="36" y="22" class="badge-text">🚀 AWESOME SMB MARKETING AUTOMATION</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Completely Unobstructed) -->
  <text x="80" y="165" class="title">SMB Marketing Automation Ecosystem</text>
  <text x="80" y="215" class="subtitle">A curated list of top commercial SaaS platforms &amp; open-source marketing automation tools</text>

  <!-- Bottom Tech/Feature Badges -->
  <g transform="translate(80, 260)">
    <!-- Badge 1: SaaS Leaders -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="24" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">💼 Top SaaS Platforms</text>
    </g>
    <!-- Badge 2: Open Source -->
    <g transform="translate(195, 0)">
      <rect width="185" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="24" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">⚡ Self-Hosted &amp; Open Source</text>
    </g>
    <!-- Badge 3: Lead Scoring & Email -->
    <g transform="translate(395, 0)">
      <rect width="210" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="24" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">📧 Email, Workflows &amp; CRM</text>
    </g>
  </g>

  <!-- Glowing Bottom Accent Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
